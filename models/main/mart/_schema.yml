version: 2

models:
  - name: mart_articles
    description: "Queria のショーケース記事（オープンデータ分析記事）のメタデータ一覧。各記事のスラッグ、タイトル、説明、公開日、参照データソース、タグを収録し、記事の検索に利用する。"
    access: public
    columns:
      - name: slug
      - name: title
      - name: description
      - name: date
      - name: datasources
      - name: tags
      - name: search_text
